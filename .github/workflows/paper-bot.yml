name: Kalshi paper bot

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub often runs these a few minutes late; that's fine)
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # lets the job commit its state + report back to the repo

concurrency:
  group: paper-bot            # never run two cycles at once
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one trading cycle
        run: python paper_bot.py

      - name: Save state and report back to the repo
        if: always()          # save even if the API hiccuped, so the error shows on the report
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state docs
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Paper bot run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
